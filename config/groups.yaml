# ============================================================================
# 概念族群對照表
#
# 這是族群定義的「唯一來源」。程式碼中不寫死任何族群名稱或成分股，
# 要新增/調整族群，只改這個檔案，不用動程式。
#
# 為什麼需要這個檔案：
#   證交所與櫃買只提供「官方產業別」(半導體業、電子零組件業...)，
#   沒有「被動元件」「ABF 載板」這類市場慣用的概念族群，只能自行維護。
#
# 格式：
#   族群名稱:
#     - "2327"  # 國巨*
#
# 規則：
#   - 代號一律用字串（加引號），避免 YAML 把 0050 解析成數字 50
#   - 同一檔可以同時出現在多個族群（例如群聯同屬 IC 設計與記憶體）
#   - 代號當日停牌或查無資料時不會使程式失敗，會列入輸出 JSON 的 missing[]
#
# 以下為「起始清單」，涵蓋各族群主流成分股，請自行增補或刪減。
# 註解中的公司簡稱已對照當日行情資料驗證過。
# ============================================================================

